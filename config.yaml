# Default configuration

DEVICE: 'cuda:0'  # Use CUDA for GPU acceleration
SAVE_DIR: './Outputs'  # Directory to save model outputs

# Dataset configuration
DATASET:
  NAME: WildOat  # Dataset class name
  ROOT: './Data'  # Root directory of the dataset
  NUM_CLASSES: 17  # 16 weed species + 1 background
  NUM_WEEKS: 11  # Growth stages from week 1 to 11
  IGNORE_LABEL: 255  # Label to ignore during training

# Model configuration
MODEL:
  NAME: RowDetectionModel  # Model name
  NUM_CLASSES: 1  # Number of segmentation classes
  PRETRAINED: ''  # Path to pretrained weights (empty means training from scratch)

# Training configuration
TRAIN:
  IMAGE_SIZE: [384, 384]  # Input image size for training
  BATCH_SIZE: 4  # Number of samples per batch
  NUM_WORKERS: 2 # Number of data loading workers
  EPOCHS: 150  # Total number of training epochs
  EVAL_INTERVAL: 8  # Evaluate model every N epochs
  AMP: False  # Automatic Mixed Precision (disable for stability)
  DDP: False  # Distributed Data Parallel training
# Optimizer configuration
OPTIMIZER:
  NAME: adamw  # AdamW optimizer
  LR: 0.0001  # Initial learning rate
  WEIGHT_DECAY: 0.0001  # L2 regularization factor
  BETAS: [0.9, 0.999]  # Adam beta parameters

# Evaluation configuration
EVAL:
  MODEL_PATH: './Pretrained/row.pth'  # Path to model for evaluation
  IMAGE_SIZE: [384, 384]  # Input image size for evaluation
  BATCH_SIZE: 1  # Batch size for evaluation
  NUM_WORKERS: 1  # Number of workers for evaluation
  SPLIT: 'test'  # Dataset split for evaluation

# Inference configuration
TEST:
  MODEL_PATH: './Pretrained/row.pth'  # Path to model for testing
  IMAGE_SIZE: [384, 384]  # Input image size for testing
  OVERLAY: True  # Enable overlay of predictions on original images
  OUTPUT_DIR: './Outputs/Predictions'  # Directory to save predictions

# Data augmentation configuration
AUGMENTATION:
  RANDOM_CROP: True  # Enable random cropping
  CROP_SCALE: [0.5, 2.0]  # Scale range for random crop
  HORIZONTAL_FLIP: True  # Enable horizontal flipping
  FLIP_PROB: 0.5  # Probability of horizontal flip
  NORMALIZE: True  # Enable ImageNet normalization
  MEAN: [0.485, 0.456, 0.406]  # ImageNet mean
  STD: [0.229, 0.224, 0.225]  # ImageNet std